name: Github All Updates

on:
  # ── Git refs ─────────────────────────────
  push:
  create:
  delete:

  # ── Pull-request lifecycle ───────────────
  pull_request:
    types: [submitted, edited, dismissed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  merge_group:

  # ── Issues & comments ────────────────────
  issues:
  issue_comment:
    types: [created, edited, deleted]

  # ── Discussions ──────────────────────────
  discussion:
  discussion_comment:
    types: [created, edited, deleted]

  # ── Classic Projects (repo level) ────────
  project:
    types:
      - created
      - edited
      - closed
      - reopened
      - deleted
      - pinned
      - unpinned
      - transferred
  project_card:
    types: [created, edited, moved, converted, deleted]
  project_column:
    types: [created, edited, moved, deleted]

  # ── Repository activity ──────────────────
  fork:
  public:
  watch:          # stars / un-stars
  gollum:         # wiki edits
  page_build:

  # ── Releases & packages ──────────────────
  release:
    types:
      - published
      - unpublished
      - created
      - edited
      - deleted
      - prereleased
      - released

  # ── CI / deployments / status checks ─────
  check_run:
  check_suite:
  status:
  deployment:
  deployment_status:

  # ── Repo administration ──────────────────
  label:
  milestone:

  # ── Manual & external triggers ───────────
  workflow_dispatch:
  repository_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Forward GitHub payload to Make.com
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          echo "Forwarding $GITHUB_EVENT_NAME to Make.com"
          curl -s -X POST \
               -H "Content-Type: application/json" \
               -d @"${GITHUB_EVENT_PATH}" \
               "$MAKE_WEBHOOK_URL"
