name: Notify Make.com Webhook

# ──────────────── TRIGGERS ────────────────
on:
  # ── Git data refs ────────────────────────
  push:                       # any branch or tag :contentReference[oaicite:2]{index=2}
  create:
  delete:

  # ── Pull-request lifecycle & reviews ─────
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
      - ready_for_review
      - converted_to_draft
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - locked
      - unlocked
      - review_requested
      - review_request_removed
      - auto_merge_enabled
      - auto_merge_disabled :contentReference[oaicite:3]{index=3}
  pull_request_review:        # submitted / edited / dismissed :contentReference[oaicite:4]{index=4}
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted] :contentReference[oaicite:5]{index=5}
  merge_group:                # merge-queue events

  # ── Issues & comments ────────────────────
  issues:
    types:
      - opened
      - edited
      - deleted
      - transferred
      - pinned
      - unpinned
      - closed
      - reopened
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - locked
      - unlocked
      - milestoned
      - demilestoned :contentReference[oaicite:6]{index=6}
  issue_comment:
    types: [created, edited, deleted]        # also covers PR comments per docs :contentReference[oaicite:7]{index=7}

  # ── Discussions ──────────────────────────
  discussion:
    types:
      - created
      - edited
      - deleted
      - answered
      - unanswered
      - transferred
      - pinned
      - unpinned
      - locked
      - unlocked
      - category_changed
  discussion_comment:
    types: [created, edited, deleted]

  # ── Classic Projects (boards / cards) ────
  project:
    types: [created, edited, closed, reopened, deleted, pinned, unpinned, transferred] :contentReference[oaicite:8]{index=8}
  project_card:
    types: [created, edited, moved, converted, deleted] :contentReference[oaicite:9]{index=9}
  project_column:
    types: [created, edited, moved, deleted]

  # ── Repository administration ────────────
  label:       {types: [created, edited, deleted]}
  milestone:   {types: [created, closed, opened, edited, deleted]}
  branch_protection_rule: {types: [created, edited, deleted]} :contentReference[oaicite:10]{index=10}
  watch:       # stars / unstars :contentReference[oaicite:11]{index=11}
  fork:
  public:
  page_build:
  gollum:      # wiki edits

  # ── Releases & packages ───────────────────
  release:
    types: [published, unpublished, created, edited, deleted, prereleased, released]
  registry_package:

  # ── CI / deployments / status checks ─────
  check_run:   {types: [created, rerequested, completed]}
  check_suite: {types: [completed]}
  status:
  deployment:
  deployment_status:

  # ── Manual & composite triggers ───────────
  workflow_dispatch:
  repository_dispatch:
  workflow_run:

# ──────────────── JOBS ────────────────
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send event payload to Make.com
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}   # Add this secret in repo settings
        run: |
          echo "Sending $GITHUB_EVENT_NAME event to Make"
          curl -s -X POST \
               -H "Content-Type: application/json" \
               -d @"${GITHUB_EVENT_PATH}" \
               "$MAKE_WEBHOOK_URL"
